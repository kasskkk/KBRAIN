services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg19-trixie
    container_name: kbrain-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kbrain-pgdata:/var/lib/postgresql
    restart: unless-stopped

volumes:
  kbrain-pgdata: